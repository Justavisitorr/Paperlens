[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "paperlens-agent"
version = "1.2.0"
description = "Evidence-grounded PDF paper analysis and offline Mermaid dashboards"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "Authlib>=1.9.5,<2",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
  "pdfplumber>=0.11,<1", "pypdfium2>=4.30,<6", "Pillow>=11,<13",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "latex2mathml>=3.81.1,<4", "cryptography>=44",
  "typer>=0.15,<1", "rich>=13.9,<15", "python-dotenv>=1,<2", "playwright>=1.50,<2",
]

[project.urls]
Repository = "https://github.com/Justavisitorr/Paperlens"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "playwright>=1.50,<2", "reportlab>=4,<5", "psutil>=7,<9"]

[project.scripts]
paperlens = "paperlens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paperlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
